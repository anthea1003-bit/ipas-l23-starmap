<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0c1120">
<title>科目三星圖</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='6' fill='%23FCB316'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#0c1120; --bg2:#121a2e; --panel:#151d33; --line:#28324f; --text:#e7ecf7; --muted:#93a0c4;
  --accent:#FCB316; --ok:#5fd38d; --bad:#f07575; --trap:#f58a8a;
  --pz:1.1; --pw:390px;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
  --sal:env(safe-area-inset-left,0px); --sar:env(safe-area-inset-right,0px);
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--text);
  font-family:-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;font-size:15px;
  -webkit-text-size-adjust:100%;overscroll-behavior:none}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:none;padding:0}
button:disabled{cursor:default}
#app{position:relative;height:100vh;height:100dvh;display:grid;grid-template-rows:auto 1fr;grid-template-columns:1fr 8px var(--pw)}

/* 標題列 */
header{grid-column:1/-1;display:flex;align-items:center;gap:14px;
  padding:calc(8px + var(--sat)) calc(16px + var(--sar)) 8px calc(16px + var(--sal));
  background:var(--bg2);border-bottom:1px solid var(--line);min-width:0}
.brand{min-width:0;flex:0 1 auto}
.brand small{display:block;color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand b{font-size:19px;letter-spacing:.06em;color:var(--accent);white-space:nowrap}
.switch{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;flex:0 0 auto}
.switch a{display:flex;align-items:center;justify-content:center;padding:0 14px;min-height:38px;color:var(--muted);text-decoration:none;font-size:14px;white-space:nowrap}
.switch a.on{background:var(--accent);color:#1b1b1b;font-weight:700}
.stats{display:flex;gap:14px;flex:1;min-width:0;overflow-x:auto;scrollbar-width:none}
.stats::-webkit-scrollbar{display:none}
.stat{min-width:84px;flex:0 0 auto}
.stat .lbl{font-size:12px;color:var(--muted);white-space:nowrap}
.stat .pct{font-size:13px;font-weight:700}
.bar{height:5px;background:var(--line);border-radius:3px;margin-top:3px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:3px;transition:width .3s}
.search{position:relative;flex:0 0 auto}
.search input{background:var(--bg);border:1px solid var(--line);color:var(--text);border-radius:10px;padding:7px 10px;width:190px;font-size:16px;font-family:inherit}
.results{position:absolute;top:calc(100% + 4px);left:0;right:0;min-width:260px;background:var(--panel);border:1px solid var(--line);border-radius:10px;z-index:30;max-height:50vh;overflow:auto;display:none}
.results button{display:block;width:100%;text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);font-size:15px;min-height:44px}
.results button span{color:var(--muted);font-size:12px;margin-left:6px}
.iconbtn{display:none;min-width:44px;min-height:44px;border-radius:10px;font-size:20px;align-items:center;justify-content:center}
.sync{display:flex;gap:6px;flex:0 0 auto}
.sync .chip-btn{min-height:36px;padding:0 10px;font-size:13px}
.countdown{text-align:center;line-height:1.05;flex:0 0 auto}
.countdown b{font-size:24px;color:var(--accent)}
.countdown small{display:block;font-size:11px;color:var(--muted);white-space:nowrap}

/* 星圖 */
#mapWrap{position:relative;overflow:hidden;touch-action:none;min-height:0;background:radial-gradient(ellipse at 45% 40%,#17203d 0%,var(--bg) 72%)}
svg#map{width:100%;height:100%;display:block;cursor:grab;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
svg#map.dragging{cursor:grabbing}
.ring{fill-opacity:.07;stroke-opacity:.45;stroke-width:1.5;stroke-dasharray:4 5}
.seclabel{font-weight:700;paint-order:stroke;stroke:var(--bg);stroke-width:5px;cursor:pointer}
.edge{stroke:#a9b8e6;stroke-opacity:.16;stroke-width:1.1}
.edge.hl{stroke:var(--accent);stroke-opacity:.9;stroke-width:2}
svg.focus .edge:not(.hl){stroke-opacity:.05}
svg.focus .node:not(.nb):not(.dim){opacity:.35}
.node{cursor:pointer}
.node .dot{stroke-width:2.2}
.node .halo{fill:none;stroke:var(--accent);stroke-width:2.5;opacity:0}
.node.sel .halo{opacity:1}
.node .wr{fill:none;stroke:var(--bad);stroke-width:3;opacity:0}
.node.err .wr{opacity:1}
.node .hit{fill:transparent}
.node .bread{opacity:0;pointer-events:none}
.node.toast .bread{opacity:1}
.node.lift .dot{stroke:#fff;stroke-width:3.5}
.node text.lb{fill:var(--text);text-anchor:middle;paint-order:stroke;stroke:var(--bg);stroke-width:4px;pointer-events:none}
svg.far .node.small text.lb{display:none}
.node.dim{opacity:.12}
.maptools{position:absolute;left:calc(12px + var(--sal));bottom:12px;display:flex;flex-direction:column;gap:6px}
.chip-btn{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:0 12px;font-size:14px;min-height:40px;white-space:nowrap}
.chip-btn.on{background:var(--accent);color:#1b1b1b;border-color:var(--accent);font-weight:700}
.chip-btn.red{border-color:var(--bad);color:var(--bad)}
.chip-btn.red.on{background:var(--bad);color:#1b1b1b}
.filters{position:absolute;right:calc(12px + var(--sar));bottom:12px;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;max-width:calc(100% - 90px)}
.loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--muted);text-align:center;padding:24px;line-height:1.8}

#rs{background:var(--bg2);border-left:1px solid var(--line);cursor:col-resize;touch-action:none;position:relative}
#rs::after{content:"";position:absolute;left:50%;top:50%;width:4px;height:48px;margin:-24px 0 0 -2px;border-radius:2px;background:var(--muted);opacity:.6}

/* 說明欄 */
#panel{--u:calc(15px * var(--pz));font-size:var(--u);background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;min-width:0;min-height:0}
.grab{display:none}
.ptools{display:flex;justify-content:flex-end;gap:6px;padding:8px 14px 0}
.ptools button{min-width:40px;min-height:36px;border:1px solid var(--line);border-radius:8px;font-size:14px;font-weight:700}
#body{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:6px 20px calc(36px + var(--sab))}
#body h2{margin:.2em 0 .3em;font-size:calc(var(--u) * 1.35);line-height:1.35}
#body h3{font-size:calc(var(--u) * .9);color:var(--muted);margin:1.3em 0 .45em;letter-spacing:.06em}
#body p,#body li{line-height:1.75}
#body ul{padding-left:1.2em;margin:.3em 0}
.back{color:var(--muted);font-size:calc(var(--u) * .87);min-height:40px}
.tag{display:inline-block;font-size:calc(var(--u) * .8);border-radius:999px;padding:2px 10px;margin:3px 4px 0 0;border:1px solid var(--line);color:var(--muted)}
.tag.hot{background:rgba(242,201,76,.14);border-color:var(--accent);color:var(--accent)}
.tag.bad{background:rgba(240,117,117,.12);border-color:var(--bad);color:var(--bad)}
.tag.ok{background:rgba(95,211,141,.12);border-color:var(--ok);color:var(--ok)}
.trapbox{background:rgba(245,138,138,.1);border-left:3px solid var(--trap);padding:8px 12px;line-height:1.7}
.prog{display:flex;gap:6px;margin-top:12px}
.prog button,.seg button{flex:1;border:1px solid var(--line);border-radius:10px;min-height:44px;font-size:calc(var(--u) * .9)}
.prog button.on,.seg button.on{border-color:var(--accent);color:var(--accent);font-weight:700}
.seg{display:flex;gap:6px}
.tip{font-size:calc(var(--u) * .8);color:var(--muted);margin-top:6px;line-height:1.6}
.list button,.list .row{display:flex;width:100%;justify-content:space-between;align-items:center;gap:8px;text-align:left;padding:10px 0;border-bottom:1px solid var(--line);min-height:44px;font-size:calc(var(--u) * .93)}
.list .n{color:var(--muted);font-size:calc(var(--u) * .8);white-space:nowrap}
.rel button{display:block;width:100%;text-align:left;padding:9px 0;border-bottom:1px solid var(--line);line-height:1.5;min-height:44px}
.rel span{display:block;font-size:calc(var(--u) * .85);color:var(--muted)}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:calc(var(--u) * .85);color:var(--muted)}
.sw{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:6px 0 4px}
.actions button{border:1px solid var(--line);border-radius:12px;padding:10px 12px;text-align:left;min-height:64px;background:var(--bg)}
.actions button b{display:block;font-size:calc(var(--u) * 1.25);color:var(--accent)}
.actions button span{font-size:calc(var(--u) * .82);color:var(--muted)}
.actions button.due b{color:var(--bad)}
.quiz{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:10px 0}
.quiz .stem{line-height:1.75;margin-bottom:8px;white-space:pre-wrap;overflow-wrap:anywhere}
.quiz .src{font-size:calc(var(--u) * .75);color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 10px;margin-bottom:4px}
.quiz .src .w{color:var(--bad)}
.quiz img{max-width:100%;border-radius:8px;background:#fff;margin:6px 0;display:block}
.qfig{margin:6px 0;overflow-x:auto}.qfig a{display:block}.qfig figcaption{font-size:calc(var(--u) * .78);color:var(--muted);margin-top:-2px}
details.ctx{border:1px dashed var(--line);border-radius:10px;padding:6px 10px;margin:4px 0 10px;background:var(--panel)}
details.ctx summary{cursor:pointer;color:var(--accent);font-size:calc(var(--u) * .85);min-height:32px;display:flex;align-items:center}
.ctxtext{white-space:pre-wrap;line-height:1.7;font-size:calc(var(--u) * .9);margin:4px 0}
pre.tbl{overflow-x:auto;background:#0a0f1c;border:1px solid var(--line);border-radius:8px;padding:8px;font-size:12px;line-height:1.45;margin:6px 0;max-width:100%}
a.reader{color:var(--accent);font-size:calc(var(--u) * .8);text-decoration:underline;white-space:nowrap}
.mast{display:grid;grid-template-columns:auto 1fr auto;gap:4px 10px;font-size:calc(var(--u) * .88);align-items:baseline}
.mast .d{color:var(--muted);font-size:calc(var(--u) * .78);white-space:nowrap}.mast .nt{grid-column:2/4;color:var(--muted);font-size:calc(var(--u) * .78);margin-top:-2px}
.node .mb{stroke:var(--bg);stroke-width:2}
input.cfg{width:100%;background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font:16px/1.4 inherit;font-family:inherit}
.opt{display:block;width:100%;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:6px 0;line-height:1.6;min-height:44px;overflow-wrap:anywhere}
.opt.wrong{border-color:var(--bad);background:rgba(240,117,117,.12)}
.opt.right{border-color:var(--ok);background:rgba(95,211,141,.14)}
.fb{margin-top:8px;line-height:1.7;font-size:calc(var(--u) * .93)}
.fb .hint{color:var(--accent)}
.fb .exp{border-top:1px dashed var(--line);margin-top:8px;padding-top:8px;white-space:pre-wrap;overflow-wrap:anywhere}
.linkbtn{color:var(--accent);text-decoration:underline;font-size:calc(var(--u) * .87);min-height:40px}
.row-acts{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
textarea.toastin,textarea.out{width:100%;min-height:76px;background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font:16px/1.6 inherit;font-family:inherit;resize:vertical}
textarea.out{min-height:260px;font-size:14px}
.savehint{font-size:calc(var(--u) * .75);color:var(--muted);height:1.4em}
.score{font-size:calc(var(--u) * 2.4);font-weight:700;color:var(--accent)}
.toast-msg{position:absolute;left:50%;top:calc(70px + var(--sat));transform:translateX(-50%);background:var(--accent);color:#1b1b1b;padding:8px 14px;border-radius:10px;font-weight:700;z-index:50;display:none;max-width:90%;text-align:center}

/* iPad 直放、iPhone：星圖滿版＋底部抽屜 */
@media (max-width:899px){
  /* iOS Safari：輸入框彈鍵盤會把整頁往上推、收鍵盤後頁首被遮；整頁釘死就不會被推 */
  html,body{position:fixed;inset:0;width:100%;height:100%}
  #app{grid-template-columns:1fr;grid-template-rows:auto 1fr}
  #rs{display:none}
  header{gap:8px;padding-top:calc(6px + var(--sat));padding-bottom:6px;flex-wrap:wrap}
  .brand{display:none}
  .switch a{padding:0 12px;min-height:40px}
  /* 手機：各章百分比改到第二列，整列可左右滑（原本是整排隱藏） */
  .stats{flex:1 1 100%;order:9;gap:12px;padding:2px 0 2px}
  .stat{min-width:72px}
  .search{position:static;flex:1;display:flex;justify-content:flex-end}
  .search input{display:none}
  .search.open input{display:block;position:absolute;left:calc(10px + var(--sal));right:calc(10px + var(--sar));top:100%;width:auto;z-index:31;margin-top:6px}
  .search.open .results{left:calc(10px + var(--sal));right:calc(10px + var(--sar));top:calc(100% + 50px);min-width:0}
  .iconbtn{display:flex}
  .filters{top:10px;bottom:auto;left:calc(10px + var(--sal));right:calc(10px + var(--sar));max-width:none;flex-wrap:nowrap;justify-content:flex-start;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
  .filters::-webkit-scrollbar{display:none}
  .maptools{top:60px;bottom:auto;left:auto;right:calc(10px + var(--sar))}
  .maptools .z{display:none}
  #panel{position:absolute;left:0;right:0;bottom:0;height:var(--sh,42%);border-left:none;border-top:1px solid var(--line);border-radius:16px 16px 0 0;box-shadow:0 -8px 30px rgba(0,0,0,.45);z-index:20;transition:height .25s ease}
  #panel.dragging{transition:none}
  .grab{display:flex;align-items:center;justify-content:center;min-height:30px;touch-action:none;cursor:grab;padding-top:8px}
  .grab i{width:40px;height:5px;border-radius:3px;background:var(--muted);opacity:.7}
  .ptools{padding:0 12px;margin-top:-30px;min-height:30px}
  #body{padding:4px calc(16px + var(--sar)) calc(28px + var(--sab)) calc(16px + var(--sal))}
}
@media (max-width:899px) and (orientation:landscape) and (max-height:500px){
  #panel{left:auto;width:min(420px,55%);top:var(--hh,52px);height:auto !important;border-radius:0;border-left:1px solid var(--line);border-top:none}
  .grab{display:none}
  .ptools{margin-top:0}
  .maptools,.filters{right:calc(min(420px,55%) + 10px)}
}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="brand"><small id="brandSmall"></small><b id="brandBig">機器學習星圖</b></div>
    <nav class="switch" id="switch" aria-label="切換科目"></nav>
    <div class="stats" id="stats"></div>
    <div class="search" id="searchBox">
      <button class="iconbtn" id="searchBtn" aria-label="搜尋考點">⌕</button>
      <input id="q" type="search" placeholder="搜尋考點…" autocomplete="off" enterkeyhint="search">
      <div class="results" id="results"></div>
    </div>
    <div class="sync"><button class="chip-btn" id="expTop">複製進度碼</button><button class="chip-btn" id="impTop">貼上進度碼</button></div>
    <div class="countdown"><b id="days">--</b><small id="examLabel">天後考試</small></div>
  </header>

  <div id="mapWrap">
    <svg id="map" xmlns="http://www.w3.org/2000/svg" aria-label="考點星圖"></svg>
    <div class="loading" id="loading">載入中…</div>
    <div class="maptools">
      <button class="chip-btn z" id="zin" aria-label="放大">＋</button>
      <button class="chip-btn z" id="zout" aria-label="縮小">－</button>
      <button class="chip-btn" id="zfit">全景</button>
    </div>
    <div class="filters" id="filters">
      <button class="chip-btn on" data-f="all">全部</button>
      <button class="chip-btn" data-f="hot" id="hotBtn">常考</button>
      <button class="chip-btn" data-f="todo">還不會</button>
      <button class="chip-btn red" data-f="wrong">錯題</button>
      <button class="chip-btn" data-f="X">指引沒寫</button>
    </div>
  </div>

  <div id="rs" role="separator" aria-label="拖曳調整說明欄寬度"></div>
  <aside id="panel">
    <div class="grab" id="grab" aria-label="拖曳調整說明欄高度"><i></i></div>
    <div class="ptools"><button id="fdn" aria-label="縮小字級">A−</button><button id="fup" aria-label="放大字級">A＋</button></div>
    <div id="body"></div>
  </aside>
  <div class="toast-msg" id="toastMsg"></div>
</div>

<script>
(() => {
"use strict";
/* ================= 科目設定 ================= */
const SUBJECTS = {
  "3": {label:"科目三", name:"機器學習技術與應用", src:"data.js", base:""}
};
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const load = k => { try { return JSON.parse(localStorage.getItem(k)) || {}; } catch (e) { return {}; } };
const save = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };
const params = new URLSearchParams(location.search);
let SID = params.get("s");

if (!SUBJECTS[SID]) SID = "3";

const SUB = SUBJECTS[SID];
if (Object.keys(SUBJECTS).length > 1) $("switch").innerHTML = Object.entries(SUBJECTS).map(([k, s]) => `<a href="?s=${k}" class="${k === SID ? "on" : ""}">${s.label}</a>`).join("");
else $("switch").style.display = "none";

fetch(SUB.src, {cache:"no-cache"})
  .then(r => { if (!r.ok) throw new Error(r.status); return r.text(); })
  .then(txt => JSON.parse(txt.slice(txt.indexOf("{"), txt.lastIndexOf("}") + 1)))   // 只當資料解析，不執行
  .then(start)
  .catch(err => {
    $("loading").innerHTML = `${SUB.label}資料載入失敗（${esc(err.message)}）。<br>${SUB.home ? `可以先到 <a style="color:var(--accent)" href="${SUB.home}">原作者的頁面</a> 看。` : "請重新整理再試一次。"}`;
  });

function start(D) {
$("loading").remove();
const M = Object.assign({pageTitle:"星圖", brandSmall:"", brandBig:"星圖", examDate:"", examLabel:"", hotMin:2, sourceNote:"", chapters:[], anchors:{}}, D.meta || {});
const STORE = M.storePrefix || M.store || ("s" + SID);
const K = {p: STORE + "-progress-v1", q: STORE + "-quiz-v1", qa: STORE + "-qa-v1", toast: STORE + "-toast-v1", pos: STORE + "-pos-v1", touch: STORE + "-touch-v1"};
let progress = load(K.p), quizLog = load(K.q), qa = load(K.qa), toasts = load(K.toast), pos = load(K.pos), touch = load(K.touch);
const ui = Object.assign({pz:1.1, pw:390, size:"hits"}, load("starmap-ui-v1"));
const saveUI = () => save("starmap-ui-v1", ui);
const CH = Object.fromEntries(M.chapters.map(c => [c.id, c]));
const color = ch => (CH[ch] || {}).color || "#d7dde9";
const isNarrow = () => matchMedia("(max-width:899px)").matches;
const isSideSheet = () => matchMedia("(max-width:899px) and (orientation:landscape) and (max-height:500px)").matches;
const L = "ABCD";

document.title = M.pageTitle;
$("brandSmall").textContent = M.brandSmall + (SUB.credit ? `・作者 ${SUB.credit}` : "");
$("brandBig").textContent = M.brandBig;
$("examLabel").textContent = "天後考試 " + M.examLabel;
$("hotBtn").textContent = `常考（≥${M.hotMin} 次）`;

/* ================= 日期與複習排程 ================= */
const ymd = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
const today = () => ymd(new Date());
const addDays = n => { const d = new Date(); d.setDate(d.getDate() + n); return ymd(d); };
const GAP = [1, 2, 4];       // 答錯→隔天；之後答對依序隔 2 天、4 天；連過三關就畢業
const qkey = (tid, qi) => tid + "#" + qi;

  if (opts.showTopic) w.querySelector("[data-goto]").onclick = () => openTopic(t.id, true, qi);
  const fb = w.querySelector(".fb"), opt = [...w.querySelectorAll(".opt")];
  const ok = Array.isArray(qz.accept) && qz.accept.length ? qz.accept : [qz.answer];
  const ansText = ok.map(i => L[i]).join("、");
  let first = true, tries = 0;
  const showAns = () => { opt.forEach(b => b.disabled = true); ok.forEach(i => opt[i].classList.add("right")); fb.innerHTML = `<div class="exp"><b>答案 (${ansText})</b>　${esc(qz.explanation)}</div>`; };
  opt.forEach(b => b.onclick = () => {
    const i = +b.dataset.i, right = ok.includes(i); tries++;
    if (first) { first = false; record(t.id, qi, right, i); if (opts.onAnswer) opts.onAnswer(right); }   // 只有第一次作答算數
    if (right) {
      b.classList.add("right"); opt.forEach(x => x.disabled = true);
      fb.innerHTML = `<div style="color:var(--ok)"><b>答對了！</b>${tries > 1 ? `（第 ${tries} 次，這題已記進錯題本）` : ""}</div><div class="exp">${esc(qz.explanation)}</div>`;
    } else {
      b.classList.add("wrong"); b.disabled = true;
      fb.innerHTML = `<div class="hint">不對喔，已記進錯題本。提示：${esc(qz.hint || "回頭看一次重點。")}</div><button class="linkbtn">想不出來，看解析</button>`;
      fb.querySelector(".linkbtn").onclick = showAns;
    }
    w.querySelector(".rec").outerHTML = recLine(t, qi);
  });
  return w;
}

/* ================= 今日複習 ================= */
function showReview() {
  select(null); reveal("full");
  const list = dueList();
  body.innerHTML = `<button class="back">← 回總覽</button><h2>今日複習</h2>
    ${list.length ? `<p class="tip" style="margin-top:0">共 ${list.length} 題。答對→下次隔更久；答錯→明天再考。</p>` : `<p>今天沒有到期的錯題 🎉</p><p class="tip">答錯的題目隔天會出現在這裡。想多練可以用模擬考。</p>`}
    <div id="rv"></div>`;
  body.querySelector(".back").onclick = showHome;
  const box = $("rv");
  list.forEach(x => box.appendChild(renderQuiz(x.t, x.q, x.qi, {showTopic:true})));
  body.scrollTop = 0;
}

/* ================= 錯題本 ================= */
function qText(x, withExp) {
  const r = qa[qkey(x.t.id, x.qi)] || {}, q = x.q;
  const ok = (Array.isArray(q.accept) && q.accept.length ? q.accept : [q.answer]).map(i => L[i]).join("、");
  const s = secById[x.t.section];
  let out = `【${q.source || ""}｜${s.id === "X" ? "" : s.id + " "}${x.t.title}】\n${q.context ? "（題組）" + q.context.text + "\n" : ""}${q.stem}${(q.figures || []).length || (q.context && (q.context.figures || []).length) ? "\n（本題有附圖，見原卷 p." + q.page + "）" : ""}\n${q.options.map((o, i) => `(${L[i]}) ${o}`).join("\n")}\n答錯時選：(${r.lastWrong || r.last || "?"})　官方答案：(${ok})　錯 ${r.w || 0} 次`;
  if (withExp) out += `\n> 解析：${q.explanation}`;
  return out;
}
function showWrongBook() {
  select(null); reveal("full");
  const list = wrongList(), open = list.filter(x => unresolved(qa[qkey(x.t.id, x.qi)]));
  body.innerHTML = `<button class="back">← 回總覽</button><h2>錯題本</h2>
    <p class="tip" style="margin-top:0">${list.length ? `共 ${list.length} 題，未過 ${open.length} 題。` : "還沒有錯題。題目第一次答錯就會自動記進來。"}</p>
    ${list.length ? `<div class="row-acts"><button class="chip-btn" id="cpAll">複製錯題本（HackMD）</button><button class="chip-btn" id="cpOpen">只複製未過的</button></div>` : ""}
    <div class="list">${list.map((x, i) => { const r = qa[qkey(x.t.id, x.qi)]; return `<div class="row"><button data-i="${i}" style="flex:1;border:none;padding:0;min-height:44px;display:block;text-align:left"><span style="display:block">${unresolved(r) ? "🔴" : "🟢"} ${esc(x.t.title)}</span><span class="n">${esc(x.q.source || "")}・錯 ${r.w} 次・答錯時選 ${esc(r.lastWrong || r.last)}${unresolved(r) ? `・複習 ${r.lvl}/${GAP.length}` : ""}</span></button><button class="chip-btn" data-cp="${i}" style="min-height:36px;font-size:12px">#錯題</button></div>`; }).join("")}</div>`;
  body.querySelector(".back").onclick = showHome;
  body.querySelectorAll("[data-i]").forEach(b => b.onclick = () => { const x = list[+b.dataset.i]; openTopic(x.t.id, true, x.qi); });
  body.querySelectorAll("[data-cp]").forEach(b => b.onclick = () => copyText("#錯題 " + qText(list[+b.dataset.cp], false), "，貼給教練"));
  const md = arr => `# ${M.summarySubject || SUB.label} 錯題本（${today().replace(/-/g, "/")}）\n\n` + arr.map(x => {
    const r = qa[qkey(x.t.id, x.qi)];
    return `### ${unresolved(r) ? "🔴" : "🟢"} ${x.t.title}\n` + qText(x, true).split("\n").slice(1).join("\n") + `\n\n🍞 記憶吐司：${toasts[x.t.id] || "（未填）"}\n`;
  }).join("\n---\n\n");
  if ($("cpAll")) $("cpAll").onclick = () => copyText(md(list), "錯題本");
  if ($("cpOpen")) $("cpOpen").onclick = () => copyText(md(open), "未過的錯題");
  body.scrollTop = 0;
}

/* ================= 外出學習摘要 ================= */
function summaryText(t) {
  const ts = tStat(t), st = progress[t.id] || 0;
  const level = ts.att ? (ts.open === 0 && st === 2 && ts.done > 0 ? "通過" : ts.open > 0 && ts.done === 0 ? "尚未過" : "部分") : ["尚未過", "部分", "通過"][st];
  const stuck = (t.quiz || []).map((q, qi) => [q, qa[qkey(t.id, qi)]]).filter(([, r]) => r && r.w > 0)
    .map(([q, r]) => `${q.source || ""}：答錯時選 (${r.lastWrong || r.last})，官方答案 (${(Array.isArray(q.accept) && q.accept.length ? q.accept : [q.answer]).map(i => L[i]).join("、")})${unresolved(r) ? `，複習中 ${r.lvl}/${GAP.length}` : "，已複習過關"}`);
  const todayRes = (t.quiz || []).map((q, qi) => [q, qa[qkey(t.id, qi)]]).filter(([, r]) => r && (r.hist || []).some(h => h[0] === today()))
    .map(([q, r]) => `${q.source || ""} ${r.hist.filter(h => h[0] === today()).slice(-1)[0][1] ? "🟢" : "🔴"}`);
  const firstSentence = String(t.summary || "").split(/(?<=。)/)[0];
  return `📋 外出學習摘要｜${today().replace(/-/g, "/")}

科目：${M.summarySubject || SUB.label}
概念：${t.title}
掌握程度：${level}

【判斷口訣】
${(t.keyPoints || [])[0] || "（無）"}

【核心比喻】
${firstSentence}

【正式定義】
${(t.keyPoints || []).map(k => "・" + k).join("\n") || "尚未學習"}

【我的推理鏈】
${toasts[t.id] && toasts[t.id].trim() ? toasts[t.id].trim() : "（未填：請用自己的話補一句）"}

【卡點紀錄】
${stuck.length ? stuck.join("\n") : "無"}

【概念關聯】
${nbrs[t.id].map(n => byId[n.id].title).join("、") || "無"}

【本次複習結果】
${todayRes.length ? todayRes.join("\n") : "無"}`;
}
function showSummary(list, title) {
  const txt = list.map(summaryText).join("\n\n————————\n\n");
  body.innerHTML = `<button class="back">← 返回</button><h2>${esc(title || "外出學習摘要")}</h2>
    <p class="tip" style="margin-top:0">格式和教練的「外出學習摘要」相同：複製後貼到 iCloud 備忘錄，回電腦再用 /update-learning 匯入。「我的推理鏈」來自你寫的記憶吐司。</p>
    <div class="row-acts"><button class="chip-btn on" id="cpSum">複製</button></div>
    <textarea class="out" readonly>${esc(txt)}</textarea>`;
  body.querySelector(".back").onclick = () => list.length === 1 ? openTopic(list[0].id, false) : showHome();
  $("cpSum").onclick = () => copyText(txt, "摘要");
  body.scrollTop = 0; reveal("full");
}
function showTodaySummary() {
  const list = touchedToday();
  if (!list.length) { toast("今天還沒有讀過、作答或寫吐司的考點"); return; }
  select(null); showSummary(list, `今天的外出學習摘要（${list.length} 個考點）`);
}

/* ================= 模擬考 ================= */
function showMockSetup() {
  select(null); reveal("full");
  body.innerHTML = `<button class="back">← 回總覽</button><h2>模擬考</h2>
    <p class="tip" style="margin-top:0">一次一題，作答後馬上看解析，最後給分數。答錯一樣會記進錯題本。</p>
    <h3>範圍</h3><div class="seg" id="scope"><button data-v="weak" class="on">還不會＋錯題優先</button><button data-v="all">全部隨機</button></div>
    <h3>題數</h3><div class="seg" id="num"><button data-v="10" class="on">10 題</button><button data-v="20">20 題</button><button data-v="50">50 題</button></div>
    <div class="row-acts" style="margin-top:16px"><button class="chip-btn on" id="go" style="min-height:48px;padding:0 24px">開始</button></div>`;
  body.querySelector(".back").onclick = showHome;
  ["scope", "num"].forEach(id => $(id).onclick = e => { const b = e.target.closest("button"); if (!b) return; [...$(id).children].forEach(x => x.classList.toggle("on", x === b)); });
  $("go").onclick = () => {
    const weak = $("scope").querySelector(".on").dataset.v === "weak", n = +$("num").querySelector(".on").dataset.v;
    const pool = allQs.map(x => {   // 加權抽題：錯過的、還不會的比較容易被抽到
      const r = qa[qkey(x.t.id, x.qi)];
      const wgt = !weak ? 1 : (unresolved(r) ? 6 : 1) * ((progress[x.t.id] || 0) === 2 ? 1 : 3) * (r && r.lastOk && !unresolved(r) ? .5 : 1);
      return {x, k:Math.pow(Math.random(), 1 / wgt)};
    }).sort((a, b) => b.k - a.k).slice(0, Math.min(n, allQs.length)).map(o => o.x);
    runMock(pool);
  };
  body.scrollTop = 0;
}
function runMock(list) {
  let i = 0, score = 0, answered = 0; const wrong = [];
  const step = () => {
    if (i >= list.length) return finish();
    const x = list[i];
    body.innerHTML = `<button class="back">← 結束</button><h2>模擬考 ${i + 1} / ${list.length}</h2><div class="tip" style="margin-top:0">目前答對 ${score} 題</div><div id="mq"></div><div class="row-acts"><button class="chip-btn on" id="next" style="display:none;min-height:48px;padding:0 24px">${i + 1 < list.length ? "下一題" : "看成績"}</button></div>`;
    body.querySelector(".back").onclick = () => { if (confirm("結束模擬考？已作答的會保留紀錄。")) finish(); };
    const card = renderQuiz(x.t, x.q, x.qi, {showTopic:false, onAnswer:ok => { answered++; if (ok) score++; else wrong.push(x); }});
    $("mq").appendChild(card);
    card.querySelectorAll(".opt").forEach(b => b.addEventListener("click", () => {   // 模擬考不給提示：第一次作答就公布答案
      const ok = Array.isArray(x.q.accept) && x.q.accept.length ? x.q.accept : [x.q.answer];
      card.querySelectorAll(".opt").forEach((o, j) => { o.disabled = true; if (ok.includes(j)) o.classList.add("right"); });
      if (!ok.includes(+b.dataset.i)) card.querySelector(".fb").innerHTML = `<div style="color:var(--bad)"><b>答錯了</b>（已記進錯題本）</div><div class="exp"><b>答案 (${ok.map(j => L[j]).join("、")})</b>　${esc(x.q.explanation)}</div>`;
      $("next").style.display = "";
    }, {once:true}));
    $("next").onclick = () => { i++; step(); };
    body.scrollTop = 0;
  };
  const finish = () => {
    const done = answered;
    body.innerHTML = `<button class="back">← 回總覽</button><h2>模擬考成績</h2>
      <div class="score">${score} / ${done}</div><p class="tip">${done ? `答對率 ${Math.round(score / Math.max(1, done) * 100)}%` : ""}</p>
      ${wrong.length ? `<h3>這次答錯（已記進錯題本）</h3><div class="list">${wrong.map((x, j) => `<button data-j="${j}"><span>🔴 ${esc(x.t.title)}</span><span class="n">${esc(x.q.source || "")}</span></button>`).join("")}</div>` : ""}
      <div class="row-acts"><button class="chip-btn" id="again">再考一次</button></div>`;
    body.querySelector(".back").onclick = showHome;
    body.querySelectorAll("[data-j]").forEach(b => b.onclick = () => { const x = wrong[+b.dataset.j]; openTopic(x.t.id, true, x.qi); });
    $("again").onclick = showMockSetup;
    body.scrollTop = 0;
  };
  step();
}

/* ================= 啟動 ================= */
if (M.examDate) {
  const days = Math.ceil((new Date(M.examDate + "T00:00:00") - new Date(new Date().toDateString())) / 864e5);
  $("days").textContent = days > 0 ? days : days === 0 ? "今天" : "—";
}
draw(); renderStats(); showHome(); setSheet(isNarrow() ? "half" : sheet);
requestAnimationFrame(() => { resetView(); lastW = W(); });
/* 深連結：#t=考點id（例 #t=5.3-05）直接開該考點；#s=小節id（例 #s=5.3）開整節；給複習計畫網頁用 */
const openFromHash = () => { const mt = /[#&]t=([^&]+)/.exec(location.hash), ms = /[#&]s=([^&]+)/.exec(location.hash); if (mt) { const id = decodeURIComponent(mt[1]); if (byId[id]) setTimeout(() => openTopic(id, true), 350); } else if (ms) { const sid = decodeURIComponent(ms[1]); const s = secs.find(x => x.id === sid); if (s) setTimeout(() => { showSection(s.id); zoomSection(s); }, 350); } };
openFromHash(); window.addEventListener("hashchange", openFromHash);
$("expTop").onclick = exportCode; $("impTop").onclick = importCode;   // 頁首也能複製／貼上進度碼（手機找得到）
/* iOS Safari 保險：鍵盤收起、回到分頁時若頁面還停在被推上去的位置，拉回頂端 */
const unshift = () => { window.scrollTo(0, 0); document.documentElement.scrollTop = 0; document.body.scrollTop = 0; };
document.addEventListener("focusout", () => setTimeout(unshift, 60));
if (window.visualViewport) visualViewport.addEventListener("resize", () => setTimeout(unshift, 60));
window.addEventListener("pageshow", unshift);
document.addEventListener("keydown", e => { if (e.key === "Escape" && !/TEXTAREA|INPUT/.test(document.activeElement.tagName)) showHome(); });
}
})();
</script>
